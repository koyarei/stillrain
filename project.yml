name: StillRain
options:
  bundleIdPrefix: com.koyarei.stillrain.dev20260618
  deploymentTarget:
    watchOS: "11.0"
settings:
  base:
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
    SWIFT_VERSION: 5.9
    DEVELOPMENT_TEAM: 5B2PZ9NDQB
targets:
  StillRainWatchApp:
    type: application
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: StillRainWatchApp/Sources
    resources:
      - path: StillRainWatchApp/Sources/Resources
    dependencies:
      - target: StillRainComplication
        embed: true
    entitlements:
      path: StillRainWatchApp/StillRainWatchApp.entitlements
    info:
      path: StillRainWatchApp/Info.plist
      properties:
        WKApplication: true
        WKAppBundleIdentifier: com.koyarei.stillrain.dev20260618
        WKWatchOnly: true
        CFBundleDisplayName: StillRain
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleTypeRole: Viewer
            CFBundleURLName: com.koyarei.stillrain.url
            CFBundleURLSchemes:
              - stillrain
        NSLocationWhenInUseUsageDescription: StillRain uses your approximate location only when saving a grounding session, if you enable location logging.
        WKBackgroundModes:
          - mindfulness
    settings:
      base:
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
        DEVELOPMENT_TEAM: 5B2PZ9NDQB
        PRODUCT_BUNDLE_IDENTIFIER: com.koyarei.stillrain.dev20260618
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  StillRainComplication:
    type: app-extension
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: StillRainComplication/Sources
    entitlements:
      path: StillRainComplication/StillRainComplication.entitlements
    info:
      path: StillRainComplication/Info.plist
      properties:
        CFBundleDisplayName: StillRain
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
        DEVELOPMENT_TEAM: 5B2PZ9NDQB
        PRODUCT_BUNDLE_IDENTIFIER: com.koyarei.stillrain.dev20260618.widgets
        GENERATE_INFOPLIST_FILE: false
  StillRainWatchAppTests:
    type: bundle.unit-test
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: StillRainWatchAppTests
    dependencies:
      - target: StillRainWatchApp
    settings:
      base:
        DEVELOPMENT_TEAM: 5B2PZ9NDQB
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: com.koyarei.stillrain.dev20260618.tests
